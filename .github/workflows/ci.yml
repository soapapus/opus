name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: 화면 자동 테스트 (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: 화면 테스트 실패 기록 올리기
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-report
          path: |
            e2e-report/
            e2e-results/
          retention-days: 7

  windows-build:
    name: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-vite build
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: Opus-setup-pr
          path: release/*-setup.exe
          retention-days: 7
