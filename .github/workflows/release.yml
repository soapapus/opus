name: Release

# main 이 바뀌면 Windows 설치본을 만들어 Releases 에 올린다.
# 자동 머지가 push 이벤트를 만들지 못하는 경우를 대비해 하루 한 번(03:00 KST)도 확인한다.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: 이미 이 커밋 설치본이 있으면 건너뛰기
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          VER=$(node -p "require('./package.json').version")
          TAG="v${VER}-${SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          # 이미 올라간 릴리스가 있으면 건너뛴다. 지난번 업로드가 중간에 실패해 '초안(draft)'으로 남았으면 지우고 다시 만든다.
          DRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$DRAFT" = "true" ]; then
            gh release delete "$TAG" --yes || true
            DRAFT=none
          fi
          if [ "$DRAFT" = "none" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; else echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v5
        if: steps.guard.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm
      - if: steps.guard.outputs.skip == 'false'
        run: npm ci
      - if: steps.guard.outputs.skip == 'false'
        run: npm test
      - if: steps.guard.outputs.skip == 'false'
        run: npx electron-vite build
      - if: steps.guard.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: eb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: eb-${{ runner.os }}-
      - name: Windows 설치본 만들기 (내려받기 실패 대비 최대 3번)
        if: steps.guard.outputs.skip == 'false'
        run: |
          for i in 1 2 3; do
            npx electron-builder --win --x64 --publish never && exit 0
            echo "설치본 만들기 실패 ($i/3), 30초 뒤 다시 시도"; sleep 30
          done
          exit 1
      - name: Releases 에 올리기
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXE=$(ls release/*-setup.exe | head -1)
          sha256sum "$EXE" | awk '{print $1}' > release/SHA256.txt
          # CHANGELOG 맨 위 '## 버전' 항목 하나만 릴리스 설명에 넣는다
          NOTES=$(awk '/^## /{n++; if (n>1) exit} n==1' CHANGELOG.md | tail -n +2 | head -40)
          BODY="설치본: 아래 Opus-${{ steps.guard.outputs.ver }}-setup.exe 를 받아 실행하세요. 설치된 앱 위에 덮어 설치하면 메모·설정은 그대로 남습니다.

          $NOTES"
          TAG="${{ steps.guard.outputs.tag }}"
          # GitHub API 가 가끔 500 을 내서 초안만 남고 실패한다 (2026-11-05 0.6.0). 남은 초안을 지우고 3번까지 다시 시도한다.
          for i in 1 2 3; do
            if gh release create "$TAG" "$EXE" release/SHA256.txt \
              --target "$(git rev-parse HEAD)" \
              --title "Opus ${{ steps.guard.outputs.ver }} ($(git rev-parse --short=7 HEAD))" \
              --notes "$BODY" --latest; then
              exit 0
            fi
            echo "릴리스 올리기 실패 ($i/3), 30초 뒤 다시 시도"
            sleep 30
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo none)" = "true" ]; then gh release delete "$TAG" --yes || true; fi
          done
          exit 1
